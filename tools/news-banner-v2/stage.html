<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="stage.css" />
    <script type="importmap">
      { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
    </script>
    <script src="runtime.js"></script>
    <script src="templates/paper.js"></script>
    <script src="templates/ink.js"></script>
    <script src="templates/brand.js"></script>
    <script src="templates/collage.js"></script>
    <script src="templates/versus.js"></script>
    <script src="templates/portrait.js"></script>
    <script src="templates/data.js"></script>
    <script src="templates/poster.js"></script>
    <script src="templates/cinematic.js"></script>
    <script src="templates/cutout.js"></script>
    <script src="social.js"></script>
    <script type="module" src="templates/monolith.js"></script>
  </head>
  <body>
    <div id="bg"></div>
    <div id="stage"></div>
    <div id="social"></div>
    <script>
      // The renderer calls __setup once (with data URLs for every asset), then __frame(t) per frame.
      // Faces the templates use. Each is loaded explicitly and checked before anything is measured.
      const FACES = ["900 100px Archivo", "200 100px Archivo", "400 100px Anton", "800 100px Bricolage", "400 100px 'Instrument Serif'", "italic 400 100px 'Instrument Serif'", "700 100px 'Space Grotesk'"];
      const frames = (n) => new Promise((done) => { const step = () => (n-- > 0 ? requestAnimationFrame(step) : done()); step(); });
      const settle = async (stage) => {
        await document.fonts.ready;
        await Promise.all([...stage.querySelectorAll("img")].map((img) => (img.complete ? null : img.decode().catch(() => null))));
        await frames(2);
      };
      window.__setup = async (data) => {
        const B = window.BANNER;
        const W = data.format ? data.format.width : 1080, H = data.format ? data.format.height : 608;
        // The social cut is 9:16: the template draws its 16:9 layout as a card near the top (social.js).
        const social = data.format && data.format.name === "social";
        const SH = social ? data.format.stageHeight : H;
        B.setFormat(W, SH);
        const stage = document.getElementById("stage");
        for (const n of [document.documentElement, document.body]) Object.assign(n.style, { width: W + "px", height: H + "px" });
        Object.assign(stage.style, { width: W + "px", height: SH + "px", top: "0px", left: "0px", transform: "", borderRadius: "", boxShadow: "" });

        window.__social = null;
        if (data.template === "monolith") await window.__monolithReady;
        const template = B.templates[data.template];
        if (!template) throw new Error("Unknown template " + data.template);
        await Promise.all([...document.fonts].map((f) => f.load().catch(() => null)));
        await Promise.all(FACES.map((f) => document.fonts.load(f).catch(() => null)));
        await document.fonts.ready;
        const missing = FACES.filter((f) => !document.fonts.check(f));
        if (missing.length) throw new Error("Fonts not loaded: " + missing.join(", "));
        const bake = async (c) => { const b = await B.bakeSticker(c.image); return { ...c, edged: b.url, aspect: b.aspect }; };
        data.cutouts = await Promise.all((data.cutouts || []).map(async (c) => ({ ...(await bake(c)), poses: await Promise.all((c.poses || []).map(bake)) })));
        // Build twice: the first pass puts every face and image in use; the second measures the
        // text again once the browser has laid them out (fitting with a fallback font shrinks it).
        const build = async () => {
          if (window.__instance && window.__instance.dispose) window.__instance.dispose();
          stage.innerHTML = "";
          B.cues = [];
          return await template(stage, data, B);
        };
        window.__instance = await build();
        await settle(stage);
        window.__instance = await build();
        await settle(stage);
        if (window.__instance.ready) await window.__instance.ready();
        if (social) {
          // Templates measure text while they build and on their first frame: scale only afterwards.
          window.__instance.frame(0);
          const k = data.format.card.w / W;
          Object.assign(stage.style, { transformOrigin: "0 0", transform: `translate(${data.format.card.x}px, ${data.format.card.y}px) scale(${k})`,
            borderRadius: 30 / k + "px", boxShadow: "0 34px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.10)" });
          // Behind the card the same banner runs again, scaled to cover the frame and blurred, so the
          // background takes its colours from the video (not for the 3D template: one renderer only).
          const bg = document.getElementById("bg");
          bg.innerHTML = "";
          Object.assign(bg.style, { width: W + "px", height: H + "px" });
          window.__mirror = null;
          let mirror = null;
          if (data.template !== "monolith") {
            const wrap = Object.assign(document.createElement("div"), { className: "mirror" });
            Object.assign(wrap.style, { position: "absolute", left: "50%", top: "50%", width: W + "px", height: SH + "px", transform: "translate(-50%, -50%)" });
            mirror = Object.assign(document.createElement("div"), { className: "mirror-stage" });
            Object.assign(mirror.style, { position: "absolute", inset: "0", overflow: "hidden", filter: "blur(9px) saturate(1.45) brightness(0.62)" });
            wrap.appendChild(mirror);
            bg.appendChild(wrap);
            const cues = B.cues;
            window.__mirror = await template(mirror, data, B);
            B.cues = cues;
            await settle(mirror);
            window.__mirror.frame(0);
            wrap.style.transform = `translate(-50%, -50%) scale(${(H / SH) * 1.12})`;
          }
          const root = document.getElementById("social");
          root.innerHTML = "";
          Object.assign(root.style, { width: W + "px", height: H + "px" });
          window.__social = B.social(root, data, B, bg, mirror);
          await settle(root);
        }
        return { poster: window.__instance.poster || 2, cues: B.cues };
      };
      // Loops are seamless: any time wraps into [0, 8). The social cut loops the banner for its whole length.
      window.__frame = (t) => {
        const loop = ((t % 8) + 8) % 8;
        window.__instance.frame(loop);
        const s = window.__social;
        if (!s) return;
        if (window.__mirror) window.__mirror.frame(loop);
        document.getElementById("social").style.visibility = "visible";
        s.frame(t);
      };
    </script>
  </body>
</html>
