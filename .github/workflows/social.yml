name: Post to social media

# Manual tools only. Stories are shared automatically: the 16:9 cut by publish.yml the moment a
# story is live, the 9:16 reel by reel.yml about every five hours (SOCIAL.md).
on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story slug to share the 16:9 cut of now (it must already be on news.s3dat.com)'
        required: false
        type: string
      dry_run:
        description: 'Only print the posts'
        type: boolean
        default: true
      force:
        description: 'Share even if the story was already shared'
        type: boolean
        default: false
      check_channels:
        description: 'Only list the Buffer channels and Pinterest boards'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      PINTEREST_BOARD: ${{ vars.PINTEREST_BOARD }}
      SOCIAL_AI_LABEL: ${{ vars.SOCIAL_AI_LABEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List channels
        if: inputs.check_channels
        run: python scripts/social.py --channels
      - name: Share the story
        if: ${{ !inputs.check_channels && inputs.story != '' }}
        env:
          STORY: ${{ inputs.story }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          if ! printf '%s' "$STORY" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then echo "Invalid slug"; exit 1; fi
          args=(--story "$STORY" --group now)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          python scripts/social.py "${args[@]}"
      - name: Commit the posting record
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- social/posted)" ]; then exit 0; fi
          git config user.name 'S3DAT News'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/posted
          git commit -q -m 'Social: posting record'
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
