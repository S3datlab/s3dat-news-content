name: Collect replies

# Every hour: collect the comments on our Mastodon and Bluesky posts into replies/inbox and open a
# "reply" issue for each; when Makima commits a draft (replies/drafts), post it to the issue.
# Nothing is ever posted to a network: Sedat posts the reply from Buffer (SOCIAL.md, Replies).
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'replies/**'
  workflow_dispatch:

permissions:
  contents: write  # commits replies/inbox
  issues: write

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  replies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect comments and update the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPLY_ASSIGNEE: ${{ vars.REPLY_ASSIGNEE }}
        run: |
          python3 scripts/replies.py --check || true
          python3 scripts/replies.py
      - name: Commit new comments
        run: |
          if [ -z "$(git status --porcelain -- replies/inbox)" ]; then exit 0; fi
          git config user.name 'S3DAT News'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add replies/inbox
          git commit -q -m 'Replies: new comments'
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
