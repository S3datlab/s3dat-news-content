name: Publish news stories

on:
  push:
    branches: [main]
    paths:
      - 'stories/**'
  workflow_dispatch:
    inputs:
      story_dir:
        description: 'Story folder: stories/YYYY/MM/DD/slug'
        required: true
        type: string

permissions:
  contents: write  # commits the social posting records (social/posted)

# One group per run: publishing is idempotent, and a shared group would cancel queued runs
# (GitHub keeps only the newest pending run per group), silently skipping stories.
concurrency:
  group: news-publish-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/news-banner-v2/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the banner engine
        run: npm ci --no-audit --no-fund --prefix tools/news-banner-v2
      - name: Find and validate changed story folders
        id: stories
        env:
          CHROME_CHANNEL: chrome
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          STORY_DIR: ${{ inputs.story_dir }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          folders = set()
          requested = os.environ.get('STORY_DIR', '')
          if requested:
              if not re.fullmatch(r'stories/2[0-9]{3}/[0-9]{2}/[0-9]{2}/[a-z0-9]+(?:-[a-z0-9]+)*', requested):
                  sys.exit('Invalid story_dir')
              if not (Path(requested) / 'story.json').is_file():
                  sys.exit('story_dir does not contain story.json')
              folders.add(requested)
          else:
              base = os.environ['BASE_SHA']
              if not base or set(base) == {'0'}:
                  paths = subprocess.check_output(['git', 'ls-files', '-z', 'stories/']).decode().split('\0')
              else:
                  if subprocess.run(['git', 'cat-file', '-e', base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                      subprocess.run(['git', 'fetch', '--depth=1', 'origin', base], check=True)
                  paths = subprocess.check_output([
                      'git', 'diff', '--name-only', '-z', base, os.environ['HEAD_SHA'], '--', 'stories/'
                  ]).decode().split('\0')
              for name in paths:
                  parts = Path(name).parts
                  if len(parts) >= 6 and parts[0] == 'stories' and parts[1].startswith('2'):
                      folder = Path(*parts[:5])
                      if (folder / 'story.json').is_file():
                          folders.add(str(folder))
          ordered = sorted(folders)
          if ordered:
              # Spec first, then render engine-2 banners, then the full check including media.
              subprocess.run([sys.executable, 'scripts/validate.py', '--spec-only', *ordered], check=True)
              subprocess.run([sys.executable, 'scripts/render.py', *ordered], check=True)
              subprocess.run([sys.executable, 'scripts/validate.py', *ordered], check=True)
          else:
              print('No changed story folders containing story.json.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('folders=' + json.dumps(ordered) + '\n')
          PY
      - name: Publish validated stories
        env:
          NEWS_INGEST_SECRET: ${{ secrets.NEWS_INGEST_SECRET }}
          NEWS_INGEST_URL: ${{ vars.NEWS_INGEST_URL || 'https://s3dat.com/api/news/ingest' }}
          STORY_FOLDERS: ${{ steps.stories.outputs.folders }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          for folder in json.loads(os.environ['STORY_FOLDERS']):
              subprocess.run([sys.executable, 'scripts/publish.py', folder], check=True)
          PY
      # The 16:9 cut goes to every channel but Instagram as soon as the story is live; the 9:16 reel
      # is reel.yml's job about every five hours (SOCIAL.md). A failure here never fails the publishing.
      - name: Share the 16:9 cut now
        id: share
        if: steps.stories.outputs.folders != '[]'
        continue-on-error: true
        env:
          CHROME_CHANNEL: chrome
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          NEWS_INGEST_SECRET: ${{ secrets.NEWS_INGEST_SECRET }}
          NEWS_INGEST_URL: ${{ vars.NEWS_INGEST_URL || 'https://s3dat.com/api/news/ingest' }}
          STORY_FOLDERS: ${{ steps.stories.outputs.folders }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          failed = False
          now = dt.datetime.now(dt.timezone.utc)
          for folder in json.loads(os.environ['STORY_FOLDERS']):
              story = json.loads((Path(folder) / 'story.json').read_text(encoding='utf-8'))
              slug = story['slug']
              published = dt.datetime.fromisoformat(story['publishedAt'].replace('Z', '+00:00'))
              if 'social' not in story or now - published > dt.timedelta(hours=12):
                  print(f'{slug}: no social block or not fresh; not shared')
                  continue
              if Path(f'social/posted/{slug}.json').is_file() and 'now' in json.loads(Path(f'social/posted/{slug}.json').read_text()):
                  print(f'{slug}: already shared')
                  continue
              wide = f'out/social/{slug}-wide.mp4'
              Path('out/social').mkdir(parents=True, exist_ok=True)
              steps = [['node', 'tools/news-banner-v2/render.mjs', folder, '--format', 'hd', '--out', wide],
                       [sys.executable, 'scripts/publish.py', '--social', slug, '--wide', wide]]
              if os.environ.get('BUFFER_API_KEY'):
                  steps.append([sys.executable, 'scripts/social.py', '--story', slug, '--group', 'now'])
              for argv in steps:
                  if subprocess.run(argv).returncode:
                      print(f'::warning::{slug}: {argv[1]} failed; not shared')
                      failed = True
                      break
          sys.exit(1 if failed else 0)
          PY
      - name: Commit the posting records
        if: always() && steps.stories.outputs.folders != '[]'
        run: |
          if [ -z "$(git status --porcelain -- social/posted)" ]; then exit 0; fi
          git config user.name 'S3DAT News'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social/posted
          git commit -q -m 'Social: posting record'
          # Makima pushes stories to main every hour; rebase onto hers and retry.
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Keep rendered banners for download
        if: always() && steps.stories.outputs.folders != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: banners-${{ github.run_id }}
          path: out/banners/
          retention-days: 14
          if-no-files-found: ignore
